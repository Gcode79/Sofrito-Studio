name = "sofrito-post-scheduler"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
main = "src/scheduler.js"

# KV binding for metrics and calendar
[[kv_namespaces]]
binding = "POST_METRICS"
# The ID will be filled after you create the KV namespace via `wrangler kv:namespace create "POST_METRICS"`
# id = "<KV_ID>"

# Fill in the new D1 binding before deploying; missing DB fails closed.
[[d1_databases]]
binding = "DB"
database_name = "sofrito-publications"
# database_id = "<D1_ID>"
migrations_dir = "migrations"

[triggers]
crons = ["0 * * * *", "0 2 * * *"]

# SCHEDULER_KEY and provider tokens are secrets, configured separately.
