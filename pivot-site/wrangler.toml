# ============================================================
# Sofrito Studio — Pivot Worker Configuration (Wrangler)
# Job: 1a
# MCP: cloudflare-builds
# Last updated: 2026-09-04
# Purpose: Single Worker serving the static site (public/) and
#          all /api/* edge logic (leads, packages, dashboards,
#          webhooks) with Queue-backed async side effects.
#
# Local dev:   npx wrangler dev --local
# Deploy:      npm run deploy  (== wrangler deploy --config wrangler.toml)
#              MANUAL ONLY — there is no CI auto-deploy. Verified 2026-09-25:
#              no push-triggered workflow in .github/workflows, zero Cloudflare
#              Builds runs, and no Cloudflare Pages project. A push to main does
#              NOT move production.
#
# One-time manual steps (IDs below are placeholders until you run):
#   npx wrangler d1 create sofrito-db
#   npx wrangler kv namespace create sofrito-config
#   npx wrangler queues create sofrito-emails
#   npx wrangler queues create sofrito-webhooks
# ============================================================

name = "sofrito-studio"
main = "src/worker.js"
compatibility_date = "2026-08-25"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[rules]]
type = "Text"
globs = ["src/emails/*.html"]
fallthrough = true

# Serve the static site (public/) from this Worker. run_worker_first = true so
# /api/* routes and edge logic intercept before the asset lookup. html_handling
# = "none" keeps .html URLs serving 200 directly (matching canonical tags and
# the sitemap). CHANGING ONE REQUIRES THE OTHER.
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

# CUTOVER 2026-09-05 — the pivot owns sofritostudio.com. To roll back to the
# retail site: comment these lines and redeploy the old worker (../cloudflare).
[[routes]]
pattern = "sofritostudio.com"
custom_domain = true
enabled = true
previews_enabled = false


# --- D1: source of truth for ALL business data ---
[[d1_databases]]
binding = "DB"
database_name = "sofrito-db"
database_id = "07a14d9b-fb0d-4413-a0b4-bd7d4389071a"

migrations_dir = "migrations"

# --- KV: source of truth for ALL config/pricing/feature flags ---
[[kv_namespaces]]
binding = "CONFIG"
id = "087850adfcab4ecf86a6987e32cc4cb2"

# --- Queues: every side effect is async ---
[[queues.producers]]
binding = "EMAIL_QUEUE"
queue = "sofrito-emails"

[[queues.producers]]
binding = "WEBHOOK_QUEUE"
queue = "sofrito-webhooks"

[[queues.consumers]]
queue = "sofrito-emails"
dead_letter_queue = "sofrito-emails-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

[[queues.consumers]]
queue = "sofrito-webhooks"
dead_letter_queue = "sofrito-webhooks-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

# --- vars (non-secret) ---
[vars]
SITE_URL = "https://sofritostudio.com"
RESEND_FROM = "hello@sofritostudio.com"
RESEND_FROM_NAME = "Sofrito Studio"
NOTIFICATION_EMAIL = "j.ortiz1148@gmail.com"
BUTTONDOWN_EMAIL = "hello@sofritostudio.com"

# Hourly tick drives lead nurture, session reminders and follow-ups,
# checkout recovery, owner reminders, and the Monday 17:00 UTC digest.
[triggers]
crons = ["0 * * * *"]
