name: Uptime Check

# Health-checks the live site + worker endpoints. Fails the run (visible in
# Actions) if any core path doesn't return HTTP 200.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check site + endpoints
        run: |
          FAILED=0
          # Only live routes. The previous list probed /products.html, /health,
          # /js/main.js, /css/style.css and /data/products.json — all retired
          # 404s — so the job failed every 6h while covering nothing.
          for path in "/" "/api/health"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 20 "https://sofritostudio.com${path}" \
                     -H "User-Agent: sofrito-uptime-check" || echo "000")
            echo "  $code  ${path}"
            [ "$code" = "200" ] || FAILED=1
          done
          if [ "$FAILED" != "0" ]; then
            echo "::error::sofritostudio.com is returning non-200 responses — check the Worker + deployment."
            exit 1
          fi
          echo "all endpoints healthy"