# Sofrito Studio CI — validates code on every push to main.
#
# Green checkmark = code is syntactically valid, safe to deploy.
# Red X = something broke, do not deploy.
name: Sofrito CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pivot-site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pivot-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check
