<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're In — Sofrito Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-slate-900 antialiased min-h-screen flex flex-col">
    <main class="flex-grow flex items-center justify-center px-4 sm:px-6 lg:px-8">
        <div class="max-w-2xl mx-auto text-center">
            <h1 class="font-serif tracking-tight text-3xl sm:text-4xl text-slate-900 mb-6">
                You're in. Check your email for your receipt and session scheduling link.
            </h1>
            <a href="https://calendly.com/sofrito-studio/sofrito-strategy-session"
               id="calendly-btn"
               class="inline-block bg-orange-600 hover:bg-orange-700 text-white font-semibold py-3 px-6 rounded-md transition-colors mb-6">
                Schedule Your Session on Calendly
            </a>
            <ul class="text-left max-w-md mx-auto text-slate-700 space-y-3 mt-8">
                <li class="flex items-start gap-2"><span class="text-orange-600 font-bold">•</span> Check your email for your receipt</li>
                <li class="flex items-start gap-2"><span class="text-orange-600 font-bold">•</span> Pick your session time on Calendly</li>
                <li class="flex items-start gap-2"><span class="text-orange-600 font-bold">•</span> Show up with your brand questions</li>
            </ul>
        </div>
    </main>
    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var name = params.get('name') || '';
            var email = params.get('email') || '';
            var btn = document.getElementById('calendly-btn');
            if (name || email) {
                var url = new URL(btn.href);
                if (name) url.searchParams.set('name', name);
                if (email) url.searchParams.set('email', email);
                btn.href = url.toString();
            }
        })();
    </script>
</body>
</html>
