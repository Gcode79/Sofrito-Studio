<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,700&family=Inter:wght@400;600;700&display=swap');

  :root {
    --ink: #1D261E;
    --paper: #F6F0E6;
    --cream: #FFF9F0;
    --red: #9E3F32;
    --green: #334B36;
    --accent: #D88B47;
    --font-display: "Cormorant Garamond", Georgia, serif;
    --font-body: "Inter", "Arial", sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px; height: 1350px;
    background: #1a1a1a; /* placeholder for image load */
    overflow: hidden;
    position: relative;
    font-family: var(--font-body);
    color: var(--ink);
  }

  /* Background image layer (text-free per Path A — deterministic typography only) */
  .bg-image {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; object-position: center;
    z-index: 1;
    opacity: 0.92; /* slight reduction so overlay has presence without destroying image */
  }

  /* Dark gradient overlay for headline contrast (light panel opacity: 0.92 reference) */
  .overlay-gradient {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(29,38,30,0.35) 0%, rgba(29,38,30,0.10) 50%, rgba(29,38,30,0.45) 100%);
    z-index: 2;
  }

  /* Typography layer — deterministic overlay (never image-generated text for business-critical copy) */
  .typography-layer {
    position: relative; z-index: 10;
    width: 1080px; height: 1350px;
    padding: 96px 88px 120px 88px; /* safe margins per carousel-tokens.yml */
    display: flex; flex-direction: column; justify-content: space-between;
  }

  /* Eyebrow (micro level) */
  .eyebrow {
    font-family: var(--font-body); font-weight: 600; font-size: 24px;
    line-height: 1.15; letter-spacing: 0.01em; color: var(--accent);
    text-transform: uppercase; text-align: left;
    max-width: 720px; max-lines: 2;
  }

  /* Headline (headline level) */
  .headline {
    font-family: var(--font-display); font-weight: 700; font-style: italic;
    font-size: 68px; line-height: 0.98; letter-spacing: -0.018em;
    color: var(--cream); text-align: left;
    max-width: 860px; max-lines: 4;
    text-shadow: 0 2px 24px rgba(0,0,0,0.55); /* ensures readability on varied backgrounds */
  }

  /* Bottom CTA block (micro level) */
  .cta-block {
    font-family: var(--font-body); font-size: 24px; font-weight: 600; line-height: 1.15;
    color: var(--cream); letter-spacing: 0.01em;
    max-width: 860px; text-align: left;
  }
  .cta-block a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent); padding-bottom: 2px; }
  .cta-block a:hover { color: var(--red); border-bottom-color: var(--red); }

  /* Slide number (micro, consistent) */
  .slide-marker {
    position: absolute; bottom: 80px; right: 88px;
    font-family: var(--font-body); font-weight: 600; font-size: 20px; color: rgba(246,240,230,0.65);
    z-index: 10; letter-spacing: 0.01em;
  }

  /* Brand mark (optional, minimal — no logo unless founder provides approved logo) */
  .brand-mark {
    position: absolute; top: 96px; right: 88px;
    font-family: var(--font-display); font-weight: 700; font-style: italic;
    font-size: 18px; color: rgba(246,240,230,0.85); letter-spacing: -0.01em;
    z-index: 10;
  }

  /* Negative space reserved for overlay — no readable text in image layer */
  /* Note for designer: Image background has no text, logos, signage, watermarks, URLs, or readable copy. */
