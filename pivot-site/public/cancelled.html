<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancelled — Sofrito Studio</title>
    <link rel="canonical" href="https://sofritostudio.com/cancelled">
    <meta name="theme-color" content="#09090b">
    <link rel="stylesheet" href="/css/theme.css">
    <script>
    /* Theme init: apply the saved theme before first paint (no flash). Dark is the default. */
    (function(){try{if(localStorage.getItem('sofrito-theme')==='light'){document.documentElement.classList.add('light');}}catch(e){}})();
    </script>
    <script src="/js/theme.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-50 antialiased min-h-screen flex flex-col items-center justify-center px-4">
    <div class="max-w-lg mx-auto text-center">
        <h1 class="font-serif tracking-tight text-3xl sm:text-4xl text-white mb-6">
            No charge was made &mdash; your session isn't booked yet.
        </h1>
        <p class="text-zinc-400 mb-8">Your Sofrito Session request is saved. Come back anytime &mdash; your session is one click away.</p>
        <a href="/#book-now" class="inline-block bg-orange-600 hover:bg-orange-700 text-white font-semibold py-3 px-6 rounded-md transition-colors">
            Back to Book
        </a>
    </div>
    <button type="button" data-theme-toggle class="theme-toggle theme-toggle--floating" aria-label="Toggle light and dark theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
</body>
</html>
